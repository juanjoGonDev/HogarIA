worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log off;
    error_log /var/log/nginx/error.log warn;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 1024;
    client_max_body_size 512k;
    
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    
    limit_req_zone $binary_remote_addr zone=api:5m rate=10r/s;
    
    upstream backend {
        server app:3000;
        keepalive 8;
    }
    
    server {
        listen 80;
        server_name _;
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        root /usr/share/nginx/html;
        index index.html;
        
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://backend/api/;
            include /etc/nginx/proxy-api-common.conf;
        }

        # 10 MiB de archivo + multipart overhead. El backend sigue imponiendo el límite real
        # de 10 MiB al fichero; el límite global de 512 KiB protege al resto de endpoints.
        location = /api/receipts {
            client_max_body_size 11m;
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://backend/api/receipts;
            include /etc/nginx/proxy-api-common.conf;
        }
        
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
