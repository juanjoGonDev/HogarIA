<svg class="plan-compare-canvas" [attr.viewBox]="viewBox" role="img" [attr.aria-label]="ariaLabel">
  <rect
    [attr.x]="canvasBounds.x"
    [attr.y]="canvasBounds.y"
    [attr.width]="canvasBounds.width"
    [attr.height]="canvasBounds.height"
    class="plan-compare-canvas__paper"
  />
  <g class="plan-compare-canvas__drawing" [attr.transform]="drawingTransform">
    <ng-container *ngIf="floor as mapFloor">
      <polygon
        *ngFor="let space of mapFloor.spaces"
        [attr.points]="spacePoints(space)"
        [attr.data-kind]="space.kind"
        class="plan-compare-canvas__space"
      />
      <line
        *ngFor="let wall of mapFloor.walls"
        [attr.x1]="wall.from.x"
        [attr.y1]="wall.from.y"
        [attr.x2]="wall.to.x"
        [attr.y2]="wall.to.y"
        [class.plan-compare-canvas__wall--exterior]="wall.kind === 'exterior'"
        class="plan-compare-canvas__wall"
        aria-hidden="true"
      />
      <ng-container *ngFor="let opening of mapFloor.openings">
        <ng-container *ngIf="openingLine(opening) as segment">
          <line
            [attr.x1]="segment.from.x"
            [attr.y1]="segment.from.y"
            [attr.x2]="segment.to.x"
            [attr.y2]="segment.to.y"
            class="plan-canvas__opening"
            [class.plan-canvas__opening--main]="opening.isMainEntrance"
            aria-hidden="true"
          />
          <ng-container *ngIf="doorSwing(opening) as swing">
            <line
              [attr.x1]="swing.hinge.x"
              [attr.y1]="swing.hinge.y"
              [attr.x2]="swing.leafTip.x"
              [attr.y2]="swing.leafTip.y"
              class="plan-canvas__door-leaf"
              aria-hidden="true"
            />
            <path [attr.d]="swing.arc" class="plan-canvas__door-swing" aria-hidden="true" />
          </ng-container>
          <line
            *ngFor="let rail of openingRails(opening)"
            [attr.x1]="rail.from.x"
            [attr.y1]="rail.from.y"
            [attr.x2]="rail.to.x"
            [attr.y2]="rail.to.y"
            class="plan-canvas__window-rail"
            aria-hidden="true"
          />
          <circle
            *ngIf="opening.isMainEntrance"
            [attr.cx]="segment.from.x"
            [attr.cy]="segment.from.y"
            r="150"
            class="plan-canvas__entrance-mark"
            aria-hidden="true"
          />
        </ng-container>
      </ng-container>
      <svg
        *ngFor="let space of mapFloor.spaces"
        householdAreaGlyph
        [kind]="space.kind"
        [attr.x]="spaceCenter(space).x - 340"
        [attr.y]="spaceCenter(space).y - 760"
        width="680"
        height="680"
        viewBox="0 0 64 64"
        class="plan-compare-canvas__glyph"
        aria-hidden="true"
      ></svg>
      <text
        *ngFor="let space of mapFloor.spaces"
        [attr.x]="spaceCenter(space).x"
        [attr.y]="spaceCenter(space).y"
        class="plan-compare-canvas__label"
      >
        {{ space.label }}
      </text>
    </ng-container>
  </g>
</svg>
