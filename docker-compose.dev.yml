# =============================================================================
# Docker Compose - HogarIA Development Environment
# =============================================================================
# Usage: docker compose -f docker-compose.dev.yml up --build

version: '3.8'

services:
  # --- Frontend (Angular Dev Server) ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend
    container_name: hogaria-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # --- Backend (Hono Dev Server) ---
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: server
    container_name: hogaria-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app/server
      - server-node-modules:/app/server/node_modules
      - dev-data:/app/data
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/app/data/hogaria-dev.sqlite
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # --- Database Viewer (Drizzle Studio) ---
  drizzle-studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: server
    container_name: hogaria-drizzle-studio
    restart: unless-stopped
    ports:
      - "4983:4983"
    volumes:
      - ./server:/app/server
      - server-node-modules:/app/server/node_modules
      - dev-data:/app/data
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/app/data/hogaria-dev.sqlite
    command: ["pnpm", "--filter", "server", "exec", "drizzle-kit", "studio"]
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  frontend-node-modules:
  server-node-modules:
  dev-data:
